name: Deploy site

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# A newer deploy replaces one that's still waiting.
concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            ASTRO_TELEMETRY_DISABLED: 1
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run test:run
            - run: npm run typecheck
            # Unit tests can't see a blank page, so load the built demo app before the site goes live.
            - run: npm run build -w @aether/editor
            - run: npm run test:smoke -w @aether/editor
            # Pages serves the site from /<repo>/, so links and assets need that prefix.
            - run: npm run build -w @aether/site
              env:
                  SITE_BASE: /${{ github.event.repository.name }}/
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: apps/site/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
